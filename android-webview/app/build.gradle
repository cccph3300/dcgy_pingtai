plugins {
    id "com.android.application"
}

android {
    namespace "cn.dongchenggy.app"
    compileSdk 35

    defaultConfig {
        applicationId "cn.dongchenggy.app"
        minSdk 23
        targetSdk 35
        versionCode 115
        versionName "1.0.15"
    }

    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
        }
    }
}
